name: scout

on:
  schedule:
    # 5:47am, 11:47am, 7:47pm MYT (UTC+8). Off the hour because GitHub delays top-of-hour runs.
    - cron: "47 21,3,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml

      - name: run scout
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scout/scout.py

      - name: commit brief
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          mkdir -p briefs && git add briefs/
          git diff --cached --quiet && exit 0
          git commit -m "brief $(TZ=Asia/Kuala_Lumpur date +'%Y-%m-%d %H:%M') MYT"
          git pull --rebase
          git push
