name: scout

# no schedule: the drafter scheduled task dispatches this and waits for it,
# so GitHub's cron delays don't matter.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "detect (scan), research (deep dive on picked stories), or voice (pull own posts)"
        required: false
        default: "detect"
      lanes:
        description: "detect only: all | open (blank = all before 10am MYT, else open)"
        required: false
        default: ""
      stories:
        description: "research only: JSON list of {id, title, summary, url, defillama_slug}"
        required: false
        default: ""
      model:
        description: "override model (blank = lanes.yaml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pyyaml

      - name: run scout
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MODE: ${{ inputs.mode }}
          LANES: ${{ inputs.lanes }}
          STORIES: ${{ inputs.stories }}
          XAI_MODEL: ${{ inputs.model }}
        run: python scout/scout.py

      - name: commit output
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          mkdir -p briefs research voice && git add briefs/ research/ voice/
          git diff --cached --quiet && exit 0
          git commit -m "${{ inputs.mode || 'detect' }} $(TZ=Asia/Kuala_Lumpur date +'%Y-%m-%d %H:%M') MYT"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
