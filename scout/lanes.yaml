# Grok scout config. One x_search call per lane per run.
# allowed_x_handles is capped at 10 per lane by the xAI API.
# Lane grouping only batches searches; nothing is filtered out.

model: grok-4.3
max_window_hours: 24              # cap on how far back an open search looks
handle_lanes_before_hour_myt: 12  # handle lanes run only on the morning run (last 24h)
research_x: true                  # false = skip the Grok deep dive, DefiLlama data only

lanes:
  - name: defi / options
    focus: onchain options, derivatives, DeFi protocol launches, yields, incentives, governance
    handles: [DeriveXYZ, ryskfinance, Defi_Dad, thedefivillain, Deebs_DeFi, casperdefi, poopmandefi, castle_labs, PinkBrains_io, 0xaporia]

  - name: defi / research
    focus: DeFi infrastructure, onchain data, protocol research, cross-chain, ethereum ecosystem
    handles: [0xSammy, Layerzero_Core, 100y_eth, hildobby, c4lvin, ByzGeneral, 0x_ultra, shivst3r, blockgraze, CryptMoose_]

  - name: markets
    focus: BTC, ETH, SOL price action and positioning, market structure, rotations
    handles: [CryptoKaleo, AltcoinSherpa, ThinkingUSD, krugman87, AlgodTrading, 0xDonPepe, ManInBlackie, WazzCrypto, Grantblocmates, chilla_ct]

  - name: security
    focus: exploits, hacks, drainers, compromised products, scams, incident response
    handles: [SEAL_911, zerokn0wledge, dethective, SpecterAnalyst, TheHackerNews, The_Cyber_News, DarkWebInformer, osintnewsletter, MagicalTux, WhiteWhaleLabs]

  - name: macro / general
    focus: macro, geopolitics affecting markets, rates, regulation, big-picture crypto narratives
    handles: [sentdefender, ImperiumPaper, AndrewAsksHow, MikeSilagadze, KingBootoshi, 0xQuit, 0xasrequired, 0xPhoenix77, RuneCrypto_, bandosei]

  - name: one piece tcg
    focus: One Piece TCG set releases, reprints, card prices, sealed product, market sentiment
    handles: [ONEPIECE_tcg, OPcom_info, Eiichiro_Staff, official_BCG_JP, OPMerchandise, AndyCollectz, yutokanzakireal, redhairshanks86, Usoppu, tanuki42_]

  - name: nft / community
    focus: NFT communities, drama, floor moves, ecosystem shutdowns or launches
    handles: [pudgypenguins, FoxyPenguinApe, HouseofChimera, manyaaww, ahboyash, mteamisloading, NPC_68]

  # every-run lanes. handle lanes above run on the morning run only.
  - name: products + onchain options
    every_run: true
    focus: >-
      Thetanuts, Odette and ZendFi updates, plus competitor and market news in onchain options
      (Derive, Rysk): launches, volumes, incentives, partnerships, criticism
    handles: [ThetanutsFi, odetteonchain, DeriveXYZ, ryskfinance]

  # open searches: no handle filter, Grok searches all of X. these run every time.
  - name: open / security
    focus: >-
      exploits, hacks, drainers, compromised products or wallets, phishing waves, supply-chain tampering,
      incident responses, post-mortems. prioritise anything where users may need to act
    handles: []

  - name: open / crosschain + bridging
    focus: >-
      bridges and interoperability: LayerZero, Wormhole, Axelar, CCIP, Across, Relay, LI.FI, Stargate,
      Hyperlane, intents and solvers, native/canonical bridges, bridge exploits, interop token or IP disputes,
      crosschain volume shifts
    handles: []

  - name: open / accountability + markets
    focus: >-
      KOLs dumping on followers, projects dumping tokens or going quiet, airdrop and TGE drama, unprofessional
      team behaviour, Strategy and other treasury companies buying or selling, macro catalysts hitting crypto,
      BTC/ETH/SOL positioning and flows
    handles: []

  - name: open / one piece tcg
    focus: >-
      One Piece TCG: set releases and reveals, reprints, Bandai pre-orders, big price moves on chase cards,
      grading/slabbing, scalpers and live-rip sellers, tournament meta shifts, onchain TCG gacha
    handles: []

  # reply targets: fresh posts from bigger accounts to reply to for visibility
  - name: reply targets
    kind: reply_targets
    window_hours: 3
    focus: >-
      One Piece TCG, crypto security and scams, crosschain/bridging, KOL and project accountability,
      BTC/ETH/SOL markets, onchain options
    handles: []
